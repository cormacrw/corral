<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Corral smiling factory icon">
<defs>
 <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#baff69"/><stop offset=".27" stop-color="#48e77c"/>
  <stop offset=".58" stop-color="#00b996"/><stop offset="1" stop-color="#005568"/>
 </linearGradient>
 <radialGradient id="light" cx=".15" cy=".08" r=".98">
  <stop stop-color="#c5ff79" stop-opacity=".65"/>
  <stop offset=".43" stop-color="#0ce49c" stop-opacity="0"/>
  <stop offset="1" stop-color="#003d55" stop-opacity=".45"/>
 </radialGradient>
 <linearGradient id="factory" x1=".05" y1=".05" x2=".95" y2=".95">
  <stop offset="0" stop-color="#ffffff"/><stop offset=".42" stop-color="#f0ffec"/>
  <stop offset=".75" stop-color="#b1ffcd"/><stop offset="1" stop-color="#57f69c"/>
 </linearGradient>
 <linearGradient id="chimney" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#ffffff"/><stop offset="1" stop-color="#8ef7a3"/>
 </linearGradient>
 <linearGradient id="smoke" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#efffce"/><stop offset="1" stop-color="#80ff83"/>
 </linearGradient>
</defs>
<rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#background)"/>
<rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#light)"/>
<!-- Chimney behind the building -->
<rect x="600" y="335" width="130" height="235" rx="23" fill="url(#chimney)"/>
<!-- Two softly joined smoke puffs -->
<path d="M650 324 C608 334 578 309 579 268 C580 225 616 197 659 199 C674 154 718 131 759 144 C811 159 830 219 803 262 C780 302 737 308 708 290 C697 311 678 321 650 324 Z" fill="url(#smoke)"/>
<!-- Factory silhouette: two sawtooth roof peaks and simple friendly body -->
<path d="M203 515 Q203 487 230 468 L362 370 Q394 348 394 389 L394 473 L513 382 Q546 356 546 398 L546 489 L685 418 Q724 398 724 445 L724 757 Q724 805 675 805 L250 805 Q203 805 203 757 Z" fill="url(#factory)"/>
<!-- Minimal friendly face -->
<ellipse cx="375" cy="620" rx="29" ry="39" fill="#071d1b"/>
<ellipse cx="552" cy="620" rx="29" ry="39" fill="#071d1b"/>
<circle cx="365" cy="602" r="9" fill="#ffffff"/>
<circle cx="542" cy="602" r="9" fill="#ffffff"/>
<path d="M430 676 Q463 714 495 676" fill="none" stroke="#071d1b" stroke-width="17" stroke-linecap="round"/>
</svg>