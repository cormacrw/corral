packages:
  - apps/*
  - packages/*

catalog:
  '@types/node': ^26.6.5
  eslint: ^10.13.0
  typescript: ^6.0.3
  vitest: ^5.0.5

allowBuilds:
  # Only re-creates symlinks inside the package (Postgres's shared libraries)
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-x64': true
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

patchedDependencies:
  async-exit-hook@2.0.1: patches/async-exit-hook@2.0.1.patch
  vitest@5.0.5: patches/vitest@5.0.5.patch
